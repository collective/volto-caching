name: volto-caching

on:
  push:
  workflow_dispatch:

env:
  python-version: "3.14"

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v7
          with:
            python-version: ${{ env.python-version }}
            cache-python: true
            enable-cache: true
            cache-suffix: "optional-suffix"
            cache-dependency-glob: |
              **/uv.lock

        - name: Check formatting
          if: ${{ success() || failure() }}
          id: ruff-format
          run: uvx ruff@latest format --diff

        - name: Check lint
          if: ${{ success() || failure() }}
          id: ruff-lint
          run: uvx ruff@latest check --diff

        - name: Report
          if: ${{ success() || failure() }}
          run: |
            echo '# Code Analysis' >> $GITHUB_STEP_SUMMARY
            echo '| Test | Status |' >> $GITHUB_STEP_SUMMARY
            echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
            echo '| Format | ${{ steps.ruff-format.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY
            echo '| Lint | ${{ steps.ruff-lint.conclusion == 'failure' && '❌' || ' ✅' }} |' >> $GITHUB_STEP_SUMMARY

  test:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7

        - name: Install the latest version of uv
          uses: astral-sh/setup-uv@v7
          with:
            python-version: ${{ env.python-version }}
            cache-python: true
            enable-cache: true
            cache-suffix: "optional-suffix"
            cache-dependency-glob: |
              **/uv.lock

        - name: Prepare containers
          run: |
            make containers-prepare

        - name: Run tests
          run: |
            make test
